<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>雙向房貸試算表 (支援新青安3.0)</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const Home = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>;
    const Calculator = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></svg>;
    const Wallet = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a8 8 0 0 1-5-1.52"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg>;
    const Percent = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="19" x2="5" y1="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg>;
    const Calendar = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>;
    const DollarSign = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="12" x2="12" y1="2" y2="22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>;
    const PiggyBank = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M19 5c-1.5 0-2.8 1.4-3 2-3.5-1.5-11-.3-11 5 0 1.8 0 3 2 4.5V20h4v-2h3v2h4v-4c1-.5 1.7-1 2-2h2v-4h-2c0-1-.5-1.5-1-2V5z"/><path d="M2 9v1c0 1.1.9 2 2 2h1"/><path d="M16 11h.01"/></svg>;
    const Hourglass = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M5 22h14"/><path d="M5 2h14"/><path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22"/><path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2"/></svg>;
    const Banknote = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect width="20" height="12" x="2" y="6" rx="2"/><circle cx="12" cy="12" r="2"/><path d="M6 12h.01M18 12h.01"/></svg>;
    const TrendingUp = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>;
    const AlertCircle = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>;

    function App() {
      const [activeTab, setActiveTab] = useState('byPrice');

      // State - Mode 1
      const [totalPrice, setTotalPrice] = useState(1875); // 預設使用圖片範例，總價 1875萬 (8成貸款為1500萬)
      const [rate1, setRate1] = useState(2.5); 
      const [ltv1, setLtv1] = useState(80); 
      const [years1, setYears1] = useState(40); 
      const [grace1, setGrace1] = useState(5); 
      const [youthType1, setYouthType1] = useState('1500'); 

      // State - Mode 2
      const [monthlyPayment, setMonthlyPayment] = useState(40000); 
      const [rate2, setRate2] = useState(2.5); 
      const [ltv2, setLtv2] = useState(80); 
      const [years2, setYears2] = useState(40); 
      const [grace2, setGrace2] = useState(5); 
      const [youthType2, setYouthType2] = useState('none'); 

      const formatMoney = (num) => {
        if (typeof num !== 'number' || isNaN(num) || !isFinite(num) || num < 0) return '0';
        return Math.round(num).toLocaleString('zh-TW');
      };

      const formatWan = (num) => {
        if (typeof num !== 'number' || isNaN(num) || !isFinite(num) || num < 0) return '0';
        return (num / 10000).toLocaleString('zh-TW', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
      };

      const handleNumberInput = (setter) => (e) => {
        const val = e.target.value;
        if (val === '') setter(''); 
        else {
          const num = Number(val);
          if (!isNaN(num) && num >= 0) setter(num);
        }
      };

      // 核心演算法：逐月模擬計算，確保階梯利率計算100%精準
      const simulateLoan = (loanAmount, years, graceYears, youthType, normalRate) => {
        let youthLimit = 0;
        if (youthType === '1000') youthLimit = 10000000;
        if (youthType === '1200') youthLimit = 12000000;
        if (youthType === '1500') youthLimit = 15000000;

        let youthCur = Math.min(loanAmount, youthLimit);
        let normalCur = Math.max(0, loanAmount - youthLimit);
        let initialYouth = youthCur;
        let initialNormal = normalCur;

        let totalPmt = 0;
        let totalInt = 0;
        let yearlyData = [];

        for (let y = 1; y <= years; y++) {
            let yearPmt = 0;
            let yearInt = 0;
            let samplePmtTotal = 0;

            for (let m = 1; m <= 12; m++) {
                let overallMonth = (y - 1) * 12 + m;
                let isGrace = overallMonth <= graceYears * 12;

                // 新青安 3.0 (2026/08新制) 階梯利率邏輯
                let youthRate = 2.275; 
                if (youthType !== 'none') {
                    if (overallMonth <= 36) youthRate = 1.775;       // 1~3年
                    else if (overallMonth <= 48) youthRate = 1.900;  // 第4年
                    else if (overallMonth <= 60) youthRate = 2.025;  // 第5年
                    else if (overallMonth <= 72) youthRate = 2.150;  // 第6年
                }

                let pmtY = 0, intY = 0, pmtN = 0, intN = 0;

                // 青安額度攤還邏輯
                if (youthCur > 0) {
                     let rY = youthRate / 100 / 12;
                     if (isGrace) {
                         pmtY = youthCur * rY;
                     } else {
                         let remain = years * 12 - overallMonth + 1;
                         pmtY = (youthCur * rY * Math.pow(1 + rY, remain)) / (Math.pow(1 + rY, remain) - 1);
                     }
                     intY = youthCur * rY;
                     youthCur -= (pmtY - intY);
                }

                // 一般額度攤還邏輯
                if (normalCur > 0) {
                     let rN = (normalRate || 0) / 100 / 12;
                     if (rN === 0) {
                         if (isGrace) pmtN = 0;
                         else {
                             let remain = years * 12 - overallMonth + 1;
                             pmtN = normalCur / remain;
                         }
                         intN = 0;
                     } else {
                         if (isGrace) {
                             pmtN = normalCur * rN;
                         } else {
                             let remain = years * 12 - overallMonth + 1;
                             pmtN = (normalCur * rN * Math.pow(1 + rN, remain)) / (Math.pow(1 + rN, remain) - 1);
                         }
                         intN = normalCur * rN;
                     }
                     normalCur -= (pmtN - intN);
                }

                let monthPmt = pmtY + pmtN;
                let monthInt = intY + intN;

                if (m === 1) samplePmtTotal = monthPmt; 
                yearPmt += monthPmt;
                yearInt += monthInt;
            }

            totalPmt += yearPmt;
            totalInt += yearInt;

            yearlyData.push({
                year: y,
                isGrace: y <= graceYears,
                monthlyPayment: samplePmtTotal
            });
        }

        let phases = [];
        let curPhase = null;
        for (let d of yearlyData) {
            let pmtRound = Math.round(d.monthlyPayment);
            let typeStr = d.isGrace ? "寬限期 (繳息)" : "本息攤還";

            if (!curPhase) {
                curPhase = { start: d.year, end: d.year, type: typeStr, pmt: pmtRound };
            } else {
                if (curPhase.type === typeStr && curPhase.pmt === pmtRound) {
                    curPhase.end = d.year;
                } else {
                    phases.push(curPhase);
                    curPhase = { start: d.year, end: d.year, type: typeStr, pmt: pmtRound };
                }
            }
        }
        if (curPhase) phases.push(curPhase);

        return { phases, totalPmt, totalInt, youthPrincipal: initialYouth, normalPrincipal: initialNormal, loanAmount };
      };

      // --- Mode 1 結算 ---
      const safeTotalPrice = Number(totalPrice) || 0;
      const targetLoan1 = (safeTotalPrice * 10000) * (ltv1 / 100);
      const res1 = simulateLoan(targetLoan1, years1, grace1, youthType1, Number(rate1) || 0);
      const downPayment1 = (safeTotalPrice * 10000) - targetLoan1;

      // --- Mode 2 結算 (二分逼近法，精確度至個位數) ---
      let bestRes2 = { phases: [], totalPmt: 0, totalInt: 0, youthPrincipal: 0, normalPrincipal: 0, loanAmount: 0 };
      const safeMonthlyPayment = Number(monthlyPayment) || 0;
      
      if (safeMonthlyPayment > 0 && years2 > 0) {
          let low = 0;
          let high = safeMonthlyPayment * years2 * 12 * 10; 
          
          for (let i = 0; i < 60; i++) { 
              let mid = (low + high) / 2;
              let sim = simulateLoan(mid, years2, grace2, youthType2, Number(rate2) || 0);
              
              let maxPmt = 0;
              if (sim.phases.length > 0) {
                  maxPmt = Math.max(...sim.phases.map(p => p.pmt));
              }

              if (maxPmt > safeMonthlyPayment) {
                  high = mid;
              } else {
                  low = mid;
                  bestRes2 = sim;
              }
          }
      }
      
      const calculatedTotalPrice2 = ltv2 > 0 ? bestRes2.loanAmount / (ltv2 / 100) : 0;
      const downPayment2 = Math.max(0, calculatedTotalPrice2 - bestRes2.loanAmount);

      return (
        <div className="min-h-screen p-3 sm:p-4 md:p-8 font-sans text-slate-800">
          <div className="max-w-4xl mx-auto space-y-4 sm:space-y-6">
            
            {/* Header */}
            <div className="text-center space-y-1 sm:space-y-2 pt-2 sm:pt-0">
              <h1 className="text-2xl sm:text-3xl font-bold text-slate-900 flex items-center justify-center gap-2">
                <Home className="w-6 h-6 sm:w-8 sm:h-8 text-blue-600" />
                雙向房貸試算表
              </h1>
              <p className="text-sm sm:text-base text-slate-500 font-medium">支援「新青安 3.0」階梯利率與混合貸款</p>
            </div>

            {/* Tabs */}
            <div className="flex rounded-xl bg-slate-200 p-1">
              <button
                onClick={() => setActiveTab('byPrice')}
                className={`flex-1 py-3 px-2 text-xs sm:text-sm md:text-base rounded-lg font-medium transition-all truncate ${
                  activeTab === 'byPrice' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-300'
                }`}
              >
                以「總房價」推算
              </button>
              <button
                onClick={() => setActiveTab('byMonthly')}
                className={`flex-1 py-3 px-2 text-xs sm:text-sm md:text-base rounded-lg font-medium transition-all truncate ${
                  activeTab === 'byMonthly' ? 'bg-white text-blue-600 shadow-sm' : 'text-slate-600 hover:text-slate-900 hover:bg-slate-300'
                }`}
              >
                以「最高月繳」推算
              </button>
            </div>

            {/* --- Calculator 1: By Price --- */}
            {activeTab === 'byPrice' && (
              <div className="grid lg:grid-cols-2 gap-4 sm:gap-6 items-start">
                <div className="bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-100 space-y-4 sm:space-y-5">
                  <h2 className="text-lg sm:text-xl font-semibold flex items-center gap-2 mb-2 sm:mb-4">
                    <Calculator className="w-5 h-5 text-blue-500" />
                    輸入條件
                  </h2>
                  
                  <div>
                    <label className="block text-sm font-medium text-slate-700 mb-1">總房價 (萬元)</label>
                    <div className="relative">
                      <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <DollarSign className="w-5 h-5 text-slate-400" />
                      </div>
                      <input type="number" min="0" value={totalPrice} onChange={handleNumberInput(setTotalPrice)} className="w-full pl-10 pr-4 py-2 text-base border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition-all" placeholder="請輸入總房價"/>
                    </div>
                  </div>

                  <div>
                    <label className="block text-sm font-medium text-slate-700 mb-1">貸款成數 (%)</label>
                    <div className="relative flex items-center gap-3 sm:gap-4">
                      <input type="range" min="10" max="100" step="5" value={ltv1} onChange={(e) => setLtv1(Number(e.target.value))} className="flex-1 min-w-0" />
                      <span className="w-14 sm:w-16 text-center text-sm sm:text-base font-semibold bg-slate-100 py-1 rounded-md">{ltv1}%</span>
                    </div>
                  </div>

                  <div className="bg-blue-50/70 border border-blue-200 rounded-lg p-4 space-y-3">
                    <div>
                      <span className="text-sm font-bold text-blue-900 flex items-center gap-1.5">
                         新青安 3.0 專案資格 
                      </span>
                      <p className="text-[11px] sm:text-xs text-blue-600/80 mt-1 flex items-center gap-1">
                        <AlertCircle className="w-3.5 h-3.5" /> 需未滿50歲、年所得低於200萬
                      </p>
                    </div>
                    <select value={youthType1} onChange={(e) => setYouthType1(e.target.value)} className="w-full px-3 py-2 text-sm border border-blue-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white text-blue-900 font-medium">
                      <option value="none">不使用青安專案 (純一般貸款)</option>
                      <option value="1000">一般首購族群 (額度 1,000 萬)</option>
                      <option value="1200">結婚兩年內 (額度 1,200 萬)</option>
                      <option value="1500">育有未成年家庭 (額度 1,500 萬)</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-sm font-medium text-slate-700 mb-1">
                      {youthType1 !== 'none' ? '一般貸款利率 (%)' : '貸款利率 (%)'}
                      {youthType1 !== 'none' && <span className="text-[10px] text-slate-400 font-normal ml-1">*超出青安額度時適用</span>}
                    </label>
                    <div className="relative">
                      <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <Percent className="w-5 h-5 text-slate-400" />
                      </div>
                      <input type="number" min="0" max="100" step="0.01" value={rate1} onChange={handleNumberInput(setRate1)} className="w-full pl-10 pr-4 py-2 text-base border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all"/>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-sm font-medium text-slate-700 mb-1">貸款年限</label>
                      <div className="relative">
                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                          <Calendar className="w-4 h-4 text-slate-400" />
                        </div>
                        <select value={years1} onChange={(e) => setYears1(Number(e.target.value))} className="w-full pl-9 pr-2 py-2 text-base border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                          <option value="20">20 年</option>
                          <option value="30">30 年</option>
                          <option value="40">40 年</option>
                        </select>
                      </div>
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-slate-700 mb-1">寬限期</label>
                      <div className="relative">
                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                          <Hourglass className="w-4 h-4 text-slate-400" />
                        </div>
                        <select value={grace1} onChange={(e) => setGrace1(Number(e.target.value))} className="w-full pl-9 pr-2 py-2 text-base border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white">
                          <option value="0">無寬限期</option>
                          <option value="1">1 年</option>
                          <option value="2">2 年</option>
                          <option value="3">3 年</option>
                          <option value="4">4 年</option>
                          <option value="5">5 年</option>
                        </select>
                      </div>
                    </div>
                  </div>
                </div>

                <div className="bg-gradient-to-br from-blue-600 to-blue-700 text-white p-4 sm:p-6 rounded-2xl shadow-xl space-y-4 sm:space-y-5 flex flex-col justify-center">
                  <h2 className="text-lg sm:text-xl font-semibold opacity-90 text-center">計算結果</h2>
                  
                  {/* 動態渲染各階段的每月應繳金額 */}
                  <div className="bg-white/10 p-3 sm:p-4 rounded-xl shadow-inner">
                    <p className="text-blue-100 text-xs sm:text-sm mb-2 flex items-center gap-1 font-medium">
                      <Calendar className="w-3.5 h-3.5" /> 
                      {res1.phases.length > 1 ? '各階段每月應繳金額' : '每月應繳金額'}
                    </p>
                    <div className="space-y-1">
                      {res1.phases.map((p, idx) => (
                        <div key={idx} className="flex justify-between items-center text-sm border-b border-blue-400/30 pb-1.5 pt-1.5 last:border-0 last:pb-0">
                          <div className="flex items-center gap-2">
                            <span className="text-white">
                              {p.start === p.end ? `第 ${p.start} 年` : `第 ${p.start} ~ ${p.end} 年`}
                            </span>
                            <span className="text-[10px] px-1.5 py-0.5 rounded bg-blue-500/80 text-blue-50 font-medium">{p.type}</span>
                          </div>
                          <span className="font-bold text-base sm:text-lg text-yellow-300">NT$ {formatMoney(p.pmt)}</span>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3 sm:gap-4">
                    <div className="bg-white/10 p-3 sm:p-4 rounded-xl border border-white/5">
                      <p className="text-blue-100 text-xs sm:text-sm mb-1 flex items-center gap-1 sm:gap-2">
                        <Wallet className="w-3.5 h-3.5" /> 房貸總額
                      </p>
                      <p className="text-lg sm:text-xl lg:text-2xl font-bold truncate">
                        {formatWan(targetLoan1)}<span className="text-xs sm:text-sm font-normal ml-1">萬元</span>
                      </p>
                      {youthType1 !== 'none' && res1.normalPrincipal > 0 ? (
                        <p className="text-[10px] sm:text-xs text-blue-200 mt-1 truncate tracking-wide">(青安 {formatWan(res1.youthPrincipal)}萬 + 一般 {formatWan(res1.normalPrincipal)}萬)</p>
                      ) : (
                        <p className="text-[10px] sm:text-xs text-blue-200 mt-1 truncate tracking-wide">({formatMoney(targetLoan1)} 元)</p>
                      )}
                    </div>
                    
                    <div className="bg-white/10 p-3 sm:p-4 rounded-xl border border-white/5">
                      <p className="text-blue-100 text-xs sm:text-sm mb-1 flex items-center gap-1 sm:gap-2">
                        <PiggyBank className="w-3.5 h-3.5" /> 頭期款準備
                      </p>
                      <p className="text-lg sm:text-xl lg:text-2xl font-bold truncate">
                        {formatWan(downPayment1)}<span className="text-xs sm:text-sm font-normal ml-1">萬元</span>
                      </p>
                      <p className="text-[10px] sm:text-xs text-blue-200 mt-1 truncate tracking-wide">({formatMoney(downPayment1)} 元)</p>
                    </div>

                    <div className="bg-white/10 p-3 sm:p-4 rounded-xl border border-white/5">
                      <p className="text-blue-100 text-xs sm:text-sm mb-1 flex items-center gap-1 sm:gap-2">
                        <Banknote className="w-3.5 h-3.5" /> 繳款總額
                      </p>
                      <p className="text-lg sm:text-xl lg:text-2xl font-bold truncate">
                        {formatWan(res1.totalPmt)}<span className="text-xs sm:text-sm font-normal ml-1">萬元</span>
                      </p>
                      <p className="text-[10px] sm:text-xs text-blue-200 mt-1 truncate tracking-wide">({formatMoney(res1.totalPmt)} 元)</p>
                    </div>

                    <div className="bg-white/10 p-3 sm:p-4 rounded-xl border border-white/5">
                      <p className="text-blue-100 text-xs sm:text-sm mb-1 flex items-center gap-1 sm:gap-2">
                        <TrendingUp className="w-3.5 h-3.5" /> 總利息支出
                      </p>
                      <p className="text-lg sm:text-xl lg:text-2xl font-bold truncate">
                        {formatWan(res1.totalInt)}<span className="text-xs sm:text-sm font-normal ml-1">萬元</span>
                      </p>
                      <p className="text-[10px] sm:text-xs text-blue-200 mt-1 truncate tracking-wide">({formatMoney(res1.totalInt)} 元)</p>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* --- Calculator 2: By Monthly Payment --- */}
            {activeTab === 'byMonthly' && (
              <div className="grid lg:grid-cols-2 gap-4 sm:gap-6 items-start">
                <div className="bg-white p-4 sm:p-6 rounded-2xl shadow-sm border border-slate-100 space-y-4 sm:space-y-5">
                  <h2 className="text-lg sm:text-xl font-semibold flex items-center gap-2 mb-2 sm:mb-4">
                    <Calculator className="w-5 h-5 text-emerald-500" />
                    輸入條件
                  </h2>
                  
                  <div>
                    <label className="block text-sm font-medium text-slate-700 mb-1">
                      能負擔最高月繳款 (元)
                    </label>
                    <div className="relative">
                      <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <DollarSign className="w-5 h-5 text-slate-400" />
                      </div>
                      <input type="number" min="0" step="1000" value={monthlyPayment} onChange={handleNumberInput(setMonthlyPayment)} className="w-full pl-10 pr-4 py-2 text-base border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none transition-all"/>
                    </div>
                  </div>

                  <div>
                    <label className="block text-sm font-medium text-slate-700 mb-1">預計貸款成數 (%)</label>
                    <div className="relative flex items-center gap-3 sm:gap-4">
                      <input type="range" min="10" max="100" step="5" value={ltv2} onChange={(e) => setLtv2(Number(e.target.value))} className="flex-1 accent-emerald-500 min-w-0" />
                      <span className="w-14 sm:w-16 text-center text-sm sm:text-base font-semibold bg-slate-100 py-1 rounded-md">{ltv2}%</span>
                    </div>
                  </div>

                  <div className="bg-emerald-50/70 border border-emerald-200 rounded-lg p-4 space-y-3">
                    <div>
                      <span className="text-sm font-bold text-emerald-900 flex items-center gap-1.5">
                        新青安 3.0 專案資格
                      </span>
                      <p className="text-[11px] sm:text-xs text-emerald-600/80 mt-1 flex items-center gap-1">
                        <AlertCircle className="w-3.5 h-3.5" /> 需未滿50歲、年所得低於200萬
                      </p>
                    </div>
                    <select value={youthType2} onChange={(e) => setYouthType2(e.target.value)} className="w-full px-3 py-2 text-sm border border-emerald-200 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none bg-white text-emerald-900 font-medium">
                      <option value="none">不使用青安專案 (純一般貸款)</option>
                      <option value="1000">一般首購族群 (額度 1,000 萬)</option>
                      <option value="1200">結婚兩年內 (額度 1,200 萬)</option>
                      <option value="1500">育有未成年家庭 (額度 1,500 萬)</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-sm font-medium text-slate-700 mb-1">
                      {youthType2 !== 'none' ? '一般貸款利率 (%)' : '貸款利率 (%)'}
                      {youthType2 !== 'none' && <span className="text-[10px] text-slate-400 font-normal ml-1">*超出青安額度時適用</span>}
                    </label>
                    <div className="relative">
                      <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <Percent className="w-5 h-5 text-slate-400" />
                      </div>
                      <input type="number" min="0" max="100" step="0.01" value={rate2} onChange={handleNumberInput(setRate2)} className="w-full pl-10 pr-4 py-2 text-base border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none transition-all" />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-sm font-medium text-slate-700 mb-1">貸款年限</label>
                      <div className="relative">
                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                          <Calendar className="w-4 h-4 text-slate-400" />
                        </div>
                        <select value={years2} onChange={(e) => setYears2(Number(e.target.value))} className="w-full pl-9 pr-2 py-2 text-base border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none bg-white">
                          <option value="20">20 年</option>
                          <option value="30">30 年</option>
                          <option value="40">40 年</option>
                        </select>
                      </div>
                    </div>
                    <div>
                      <label className="block text-sm font-medium text-slate-700 mb-1">寬限期</label>
                      <div className="relative">
                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                          <Hourglass className="w-4 h-4 text-slate-400" />
                        </div>
                        <select value={grace2} onChange={(e) => setGrace2(Number(e.target.value))} className="w-full pl-9 pr-2 py-2 text-base border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none bg-white">
                          <option value="0">無寬限期</option>
                          <option value="1">1 年</option>
                          <option value="2">2 年</option>
                          <option value="3">3 年</option>
                          <option value="4">4 年</option>
                          <option value="5">5 年</option>
                        </select>
                      </div>
                    </div>
                  </div>
                </div>

                <div className="bg-gradient-to-br from-emerald-600 to-emerald-700 text-white p-4 sm:p-6 rounded-2xl shadow-xl space-y-4 sm:space-y-5 flex flex-col justify-center">
                  <h2 className="text-lg sm:text-xl font-semibold opacity-90 text-center">計算結果</h2>
                  
                  <div className="bg-white/10 p-3 sm:p-4 rounded-xl shadow-inner border border-white/5">
                    <p className="text-emerald-100 text-sm mb-1 flex items-center gap-2">
                      <Home className="w-4 h-4" /> 可購買總房價約
                    </p>
                    <p className="text-3xl sm:text-4xl font-bold text-center my-1 sm:my-2 truncate text-yellow-300">
                      {formatWan(calculatedTotalPrice2)}
                      <span className="text-lg sm:text-xl font-normal ml-1 sm:ml-2 text-white">萬元</span>
                    </p>
                  </div>

                  <div className="bg-white/10 p-3 sm:p-4 rounded-xl shadow-inner border border-white/5">
                    <p className="text-emerald-100 text-xs sm:text-sm mb-2 flex items-center gap-1 font-medium">
                      <Calendar className="w-3.5 h-3.5" /> 
                      {bestRes2.phases.length > 1 ? '各階段每月應繳金額 (反推估計)' : '每月應繳金額'}
                    </p>
                    <div className="space-y-1">
                      {bestRes2.phases.map((p, idx) => (
                        <div key={idx} className="flex justify-between items-center text-sm border-b border-emerald-400/30 pb-1.5 pt-1.5 last:border-0 last:pb-0">
                          <div className="flex items-center gap-2">
                            <span className="text-white">
                              {p.start === p.end ? `第 ${p.start} 年` : `第 ${p.start} ~ ${p.end} 年`}
                            </span>
                            <span className="text-[10px] px-1.5 py-0.5 rounded bg-emerald-500/80 text-emerald-50 font-medium">{p.type}</span>
                          </div>
                          <span className="font-bold text-base sm:text-lg">NT$ {formatMoney(p.pmt)}</span>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3 sm:gap-4">
                    <div className="bg-white/10 p-3 sm:p-4 rounded-xl border border-white/5">
                      <p className="text-emerald-100 text-xs sm:text-sm mb-1 flex items-center gap-1 sm:gap-2">
                        <Wallet className="w-3.5 h-3.5" /> 房貸總額
                      </p>
                      <p className="text-lg sm:text-xl lg:text-2xl font-bold truncate">
                        {formatWan(bestRes2.loanAmount)}<span className="text-xs sm:text-sm font-normal ml-1">萬元</span>
                      </p>
                      {youthType2 !== 'none' && bestRes2.normalPrincipal > 0 ? (
                        <p className="text-[10px] sm:text-xs text-emerald-200 mt-1 truncate tracking-wide">(青安 {formatWan(bestRes2.youthPrincipal)}萬 + 一般 {formatWan(bestRes2.normalPrincipal)}萬)</p>
                      ) : (
                        <p className="text-[10px] sm:text-xs text-emerald-200 mt-1 truncate tracking-wide">({formatMoney(bestRes2.loanAmount)} 元)</p>
                      )}
                    </div>
                    
                    <div className="bg-white/10 p-3 sm:p-4 rounded-xl border border-white/5">
                      <p className="text-emerald-100 text-xs sm:text-sm mb-1 flex items-center gap-1 sm:gap-2">
                        <PiggyBank className="w-3.5 h-3.5" /> 頭期款準備
                      </p>
                      <p className="text-lg sm:text-xl lg:text-2xl font-bold truncate">
                        {formatWan(downPayment2)}<span className="text-xs sm:text-sm font-normal ml-1">萬元</span>
                      </p>
                      <p className="text-[10px] sm:text-xs text-emerald-200 mt-1 truncate tracking-wide">({formatMoney(downPayment2)} 元)</p>
                    </div>

                    <div className="bg-white/10 p-3 sm:p-4 rounded-xl border border-white/5">
                      <p className="text-emerald-100 text-xs sm:text-sm mb-1 flex items-center gap-1 sm:gap-2">
                        <Banknote className="w-3.5 h-3.5" /> 繳款總額
                      </p>
                      <p className="text-lg sm:text-xl lg:text-2xl font-bold truncate">
                        {formatWan(bestRes2.totalPmt)}<span className="text-xs sm:text-sm font-normal ml-1">萬元</span>
                      </p>
                      <p className="text-[10px] sm:text-xs text-emerald-200 mt-1 truncate tracking-wide">({formatMoney(bestRes2.totalPmt)} 元)</p>
                    </div>

                    <div className="bg-white/10 p-3 sm:p-4 rounded-xl border border-white/5">
                      <p className="text-emerald-100 text-xs sm:text-sm mb-1 flex items-center gap-1 sm:gap-2">
                        <TrendingUp className="w-3.5 h-3.5" /> 總利息支出
                      </p>
                      <p className="text-lg sm:text-xl lg:text-2xl font-bold truncate">
                        {formatWan(bestRes2.totalInt)}<span className="text-xs sm:text-sm font-normal ml-1">萬元</span>
                      </p>
                      <p className="text-[10px] sm:text-xs text-emerald-200 mt-1 truncate tracking-wide">({formatMoney(bestRes2.totalInt)} 元)</p>
                    </div>
                  </div>
                </div>
              </div>
            )}

            <div className="text-center text-xs sm:text-sm text-slate-400 mt-6 sm:mt-8 space-y-1.5 pb-8">
              <p>註：此試算依據2026/8月「新青安3.0」方案計算。利率依年份採階梯補貼遞減 (第1~3年1.775%、第4年1.9%、第5年2.025%、第6年2.15%、第7年起2.275%)。</p>
              <p>購屋總價上限依縣市有別 (台北3,500萬 / 新北新竹2,500萬 / 其他2,000萬)。實際核貸金額與利率以各家銀行規定為準。</p>
              <p className="text-slate-300">本工具所有運算皆於設備端執行，無資料外洩風險，請安心使用。</p>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
